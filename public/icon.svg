<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
<!--
  Favicon com chapa, e não com troca por tema.

  A troca por `prefers-color-scheme` foi testada e NÃO funciona no Chrome:
  lendo o bitmap que ele grava no perfil, o ícone rasterizado é byte a byte
  o mesmo em tema claro e escuro — ele sempre aplica a regra padrão. Com a
  marca transparente isso deixava preto sobre preto na barra de abas escura.

  A chapa #0a0a0a (o fundo do site) resolve sem depender de suporte: sobre
  barra clara lê como quadrado escuro com a marca branca; sobre barra escura
  a chapa some no fundo e sobra a marca branca. Legível nos dois, em qualquer
  navegador.
-->
<rect width="128" height="128" rx="26" fill="#0a0a0a"/>
<image x="12" y="12" width="104" height="104" href="data:image/png;base64,"/>
</svg>
