<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
<!--
  Favicon único com as duas variantes da marca embutidas.

  Existe porque o par de PNGs com `media` no <link> não basta: o navegador
  também busca /favicon.ico, que não tem media, e acabava vencendo no tema
  escuro — a marca escura sobre a barra de abas escura. Um arquivo só, com a
  troca feita aqui dentro, elimina a disputa.

  A regra padrão mostra a marca escura (fundo claro); a media query troca
  para a branca quando o sistema está em tema escuro.
-->
<style>
  .escuro { display: none }
  @media (prefers-color-scheme: dark) {
    .claro { display: none }
    .escuro { display: inline }
  }
</style>
<image class="claro" width="128" height="128" href="data:image/png;base64,"/>
<image class="escuro" width="128" height="128" href="data:image/png;base64,"/>
</svg>
